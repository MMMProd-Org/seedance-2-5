<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="490" viewBox="0 0 1400 490" role="img" aria-labelledby="title desc">
  <title id="title">One idea. Three directing choices.</title>
  <desc id="desc">An illustrated text example: a fixed medium shot lasting six seconds, one breath released, and a closed door with the character's hands staying together.</desc>
  <rect width="1400" height="490" rx="18" fill="#101511"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="43" fill="#aab5a3" font-size="17" letter-spacing="3">SEEDANCE 2.5 / DIRECTION NOTES</text>
    <text x="1358" y="43" fill="#aab5a3" font-size="17" text-anchor="end" letter-spacing="2">TEXT EXAMPLE</text>
    <path d="M42 65H1358" stroke="#394334"/>
    <g transform="translate(42 88)">
      <rect width="422" height="324" rx="12" fill="#1b251c" stroke="#414e3c"/>
      <text x="26" y="41" fill="#d1e987" font-size="23" font-weight="700" letter-spacing="2">01 / FRAME</text>
      <g fill="none" stroke="#d1e987" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="156" y="72" width="110" height="149" rx="7"/>
        <path d="M175 102V91H186M236 91H247V102M247 191V202H236M186 202H175V191"/>
        <ellipse cx="211" cy="124" rx="13" ry="17"/>
        <path d="M186 170Q185 143 199 143H223Q237 143 236 170V186H186Z"/>
        <path d="M190 159Q197 175 211 175Q226 175 233 159"/>
      </g>
      <path d="M101 233H321" stroke="#75846b" stroke-dasharray="5 7"/>
      <text x="211" y="266" fill="#f0eee2" font-size="25" font-weight="700" text-anchor="middle">The camera stays put.</text>
      <text x="211" y="300" fill="#b8c2af" font-size="21" text-anchor="middle">6 seconds · 9:16 · medium shot</text>
    </g>
    <g transform="translate(489 88)">
      <rect width="422" height="324" rx="12" fill="#1b251c" stroke="#414e3c"/>
      <text x="26" y="41" fill="#d1e987" font-size="23" font-weight="700" letter-spacing="2">02 / PERFORMANCE</text>
      <path d="M65 157H104C128 157 137 157 151 132C166 102 180 102 195 132C211 163 218 187 237 187C254 187 264 157 288 157H357" fill="none" stroke="#d1e987" stroke-width="4" stroke-linecap="round"/>
      <path d="M65 210H357" stroke="#75846b" stroke-width="2"/>
      <g fill="#d1e987"><circle cx="65" cy="210" r="4"/><circle cx="211" cy="210" r="4"/><circle cx="357" cy="210" r="4"/></g>
      <g fill="#b8c2af" font-size="17" text-anchor="middle"><text x="65" y="235">0s</text><text x="211" y="235">3s</text><text x="357" y="235">6s</text></g>
      <text x="211" y="266" fill="#f0eee2" font-size="25" font-weight="700" text-anchor="middle">One breath. One release.</text>
      <text x="211" y="300" fill="#b8c2af" font-size="21" text-anchor="middle">A small action you can describe.</text>
    </g>
    <g transform="translate(936 88)">
      <rect width="422" height="324" rx="12" fill="#1b251c" stroke="#414e3c"/>
      <text x="26" y="41" fill="#d1e987" font-size="23" font-weight="700" letter-spacing="2">03 / CONTINUITY</text>
      <g fill="none" stroke="#d1e987" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="144" y="79" width="134" height="146" rx="3"/>
        <path d="M211 79V225M157 99H197V210H157ZM225 99H265V210H225M202 143V164M220 143V164"/>
        <path d="M174 116L182 108M237 186L248 175" stroke="#91a775"/>
      </g>
      <text x="211" y="266" fill="#f0eee2" font-size="25" font-weight="700" text-anchor="middle">The scene holds together.</text>
      <text x="211" y="300" fill="#b8c2af" font-size="21" text-anchor="middle">Hands together. Door closed.</text>
    </g>
    <path d="M42 439H1358" stroke="#394334"/>
    <text x="42" y="472" fill="#b8c2af" font-size="19">YOUR IDEA → DIRECTING CHOICES → A PROMPT TO TAKE TO YOUR VIDEO TOOL</text>
  </g>
</svg>
