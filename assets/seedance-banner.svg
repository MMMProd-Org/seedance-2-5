<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Seedance 2.5: give your scene a plan</title>
  <desc id="description">An original cinema-inspired banner. A dark teal scene frame, an amber focus mark and three connected shots represent action, camera and continuity.</desc>
