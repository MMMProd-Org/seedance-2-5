      <stop stop-color="#101d25"/>
      <stop offset="1" stop-color="#18383b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#355b60"/>
      <stop offset="1" stop-color="#10292e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
