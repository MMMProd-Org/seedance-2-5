    <text x="275" y="337" font-size="14" letter-spacing="2" fill="#c8ddd4">A CLEAR PROMPT</text>
    <text x="497" y="337" font-size="14" letter-spacing="2" fill="#c8ddd4">YOUR SHOT</text>
    <path d="M187 331H246M439 331H469" stroke="#6c9590" stroke-width="2"/>
    <text x="68" y="392" font-size="13" fill="#a6bfb6">FOR CLAUDE AND CODEX</text>
