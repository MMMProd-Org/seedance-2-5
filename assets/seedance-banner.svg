    <text x="62" y="171" font-size="76" font-weight="700" letter-spacing="-3" fill="#fff4df">Seedance <tspan fill="#ffbd73">2.5</tspan></text>
    <text x="67" y="221" font-size="30" fill="#e2eae4">Give your scene a plan.</text>
    <text x="68" y="263" font-size="17" fill="#b7ccc5">Action. Camera. Performance. Continuity.</text>
